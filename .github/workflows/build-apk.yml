name: Build Free Minimalist Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build APK
      run: gradle assembleRelease --no-daemon

    - name: Copy APK for Distribution
      run: cp app/build/outputs/apk/release/app-release.apk MinimalistLauncher-Free.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinimalistLauncher-Free-APK
        path: MinimalistLauncher-Free.apk

    - name: Publish GitHub Release v1.3.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.3.0
        name: "Minimalist Launcher v1.3.0 (Accurate Screen Time & Privacy Redesign)"
        body: |
          🚀 What's New in v1.3.0:
          - ⏱️ Accurate Screen Time Calculation: Uses event-based tracking strictly from midnight today (fixes impossible 10h 22m morning reports and 91h weekly counts).
          - 🔒 Home Screen Privacy: Replaced exposed statistics banner with discrete `[ 📊 Digital Wellbeing & Reports ]` button to keep your personal usage private from bystanders.
          - 🧘 Long-Press App Controls: Long-press any app on the home screen to toggle 5-second mindful delay or remove duplicates in 1 click.
          - ⚡ Mindful Delay Fixed: Target apps open reliably without foreground service crashes.
          - 🔄 1-Tap In-App Auto-Updater: Updates directly inside the app!
        files: MinimalistLauncher-Free.apk
