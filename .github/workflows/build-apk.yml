name: Build Free Minimalist Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build APK
      run: gradle assembleRelease --no-daemon

    - name: Copy APK for Distribution
      run: cp app/build/outputs/apk/release/app-release.apk MinimalistLauncher-Free.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinimalistLauncher-Free-APK
        path: MinimalistLauncher-Free.apk

    - name: Publish GitHub Release v1.2.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.0
        name: "Minimalist Launcher v1.2.0 (In-App Auto-Updater & Digital Wellbeing)"
        body: |
          🚀 What's New in v1.2.0:
          - 🔄 Built-in In-App Auto-Updater (update directly inside the app with 1-tap!)
          - 🔐 Permanent cryptographic key (resolves package conflicts permanently)
          - ⏱️ Live Digital Wellbeing Daily & 7-Day Weekly Reports
          - 12-Hour Clock with AM/PM & Daily Positive Affirmations
          - Mindful 5-second breathing delays for YouTube & JioHotstar
        files: MinimalistLauncher-Free.apk
